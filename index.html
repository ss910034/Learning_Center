<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>學習中心｜人類圖閘門學習</title>
  <meta name="description" content="人類圖 64 閘門學習網站：教學、小知識、生活範例與抽考檢核。">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // 在載入樣式後、繪製前套用使用者選擇的主題，避免閃爍
    (function () {
      try {
        var t = JSON.parse(localStorage.getItem("hd_theme"));
        if (t && t !== "auto") document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#/home">🧭 學習中心</a>
    <nav class="site-nav" id="site-nav">
      <a href="#/home" data-nav="home">首頁</a>
      <a href="#/lessons" data-nav="lessons">教學</a>
      <a href="#/gates" data-nav="gates">64 閘門</a>
      <a href="#/tidbits" data-nav="tidbits">小知識</a>
      <a href="#/quiz" data-nav="quiz">抽考</a>
      <a href="#/progress" data-nav="progress">學習進度</a>
    </nav>
    <select id="theme-select" class="theme-select" title="切換佈景主題">
      <option value="auto">🎨 跟隨系統</option>
      <option value="light">☀️ 淺色</option>
      <option value="violet">🔮 深夜紫</option>
      <option value="midnight">🌌 午夜藍</option>
      <option value="oled">🌑 純黑</option>
      <option value="forest">🌲 墨綠</option>
    </select>
  </header>

  <main id="app" class="container"></main>

  <footer class="site-footer">
    <p>學習中心 · 人類圖閘門學習｜學習紀錄僅儲存在你的瀏覽器中</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/gates_detail.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
