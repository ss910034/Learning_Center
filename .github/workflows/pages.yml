name: Deploy to GitHub Pages

# GitHub Pages 由 gh-pages 分支提供服務；
# 此 workflow 在開發分支推送時自動把內容同步到 gh-pages。
on:
  push:
    branches: [claude/learning-site-human-design-6hx5gp, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-sync
  cancel-in-progress: true

jobs:
  sync-to-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push current branch to gh-pages
        run: git push origin HEAD:gh-pages --force
